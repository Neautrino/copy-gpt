<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Copy Chat</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img class="logo" src="/icon/48.png" alt="" width="28" height="28" />
        <div class="heading">
          <h1>Copy Chat</h1>
          <p class="status" id="status">Checking this tab…</p>
        </div>
      </header>

      <section class="actions" aria-label="Export this chat">
        <button class="primary" id="copy" type="button" disabled>
          <span class="icon" data-icon="copy spinner check"></span>
          <span class="primary-label">Copy chat</span>
          <kbd id="shortcut" hidden></kbd>
        </button>
        <div class="secondary">
          <button type="button" id="markdown" disabled><span data-icon="download"></span>Markdown</button>
          <button type="button" id="json" disabled><span data-icon="braces"></span>JSON</button>
        </div>
        <p class="result" id="result" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="include-heading">
        <h2 id="include-heading">Include in exports</h2>
        <div id="options" class="options"></div>
      </section>

      <footer class="footer">
        <span>Tip: right-click a chat to copy it.</span>
        <span id="version"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
